name: NextJS Test Workflow
on:
  - test

jobs:
  build:
    steps:
      - name: Install dependencies
        run: npm ci
      - name: Build Next.js app
        run: npm run build
      - name: Run lint
        run: npm run lint || echo "No linter configured"
      - name: Run tests
        run: npm test || echo "No tests configured"
      - name: Run e2e (optional)
        run: npx cypress run || echo "No e2e configured"
